[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosys-activity-logs"
version = "0.1.0"
description = "Activity log for Django: who created, changed or deleted what, and who signed in or out."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[tool.setuptools.packages.find]
include = ["activity_logs*"]
